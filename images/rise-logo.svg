<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="riseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2145"/>
      <stop offset="60%" stop-color="#1479E8"/>
      <stop offset="100%" stop-color="#16B866"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C879"/>
      <stop offset="100%" stop-color="#16B866"/>
    </linearGradient>
  </defs>
  <!-- Rising Sun & Leaf / Humanity Emblem -->
  <g transform="translate(10, 10)">
    <!-- Arch / Horizon -->
    <path d="M 12 48 A 24 24 0 0 1 48 48" fill="none" stroke="#DDE4EC" stroke-width="3" stroke-linecap="round"/>
    <!-- Rising Rays / Growing Shoot -->
    <path d="M 30 46 L 30 18" stroke="url(#riseGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Upward soaring leaves / wings of hope -->
    <path d="M 30 28 C 42 22 52 14 54 6 C 54 18 44 32 30 36 Z" fill="url(#sunGrad)"/>
    <path d="M 30 34 C 18 28 8 20 6 12 C 6 24 16 38 30 42 Z" fill="#0B2145"/>
    <circle cx="30" cy="10" r="4.5" fill="#20C879"/>
  </g>
  <!-- Wordmark -->
  <text x="78" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="30" letter-spacing="1.5" fill="#0B2145">RISE</text>
  <text x="172" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="22" letter-spacing="3" fill="#16B866">INTL</text>
  <text x="79" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="2" fill="#5D6878">EMPOWERING COMMUNITIES</text>
</svg>
